# Runs the backend tests on every push that touches backend/.
# Render deploys the backend itself (render.yaml); it waits for these checks
# to pass first (autoDeployTrigger: checksPass), so failing tests block a deploy.

name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      # Default groups only: the calibration and Catanatron tests skip themselves
      - run: uv run --frozen pytest -q
